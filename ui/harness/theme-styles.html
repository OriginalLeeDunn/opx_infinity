<!doctype html>
<html lang="en" class="op-theme-city">
<head>
<meta charset="utf-8">
<title>OPEN//77 theme styles harness</title>
<!--
  THE TWO LOOKS, SIDE BY SIDE IN TIME: open this page with `?style=minimal` or
  `?style=cyberpunk` and the same HUD, menu and toast are drawn in that style.

  It mounts the same `ui/src/boot/main.ts` the game mounts and delivers the style the
  way Lua does, on `opx:theme:set` -- so what is on screen went through `theme.ts`'s
  allowlist and nothing here writes the attribute by hand. The payload carries ONLY the
  style: the colours are each style's own stylesheet fallbacks, which the Lua suite
  holds equal to what the shipped config derives.

  It then checks the one thing a screenshot cannot: that the attribute landed, and that
  an unknown style is refused rather than written.

  Run it with the dev server:  npm run dev  ->  /harness/theme-styles.html?style=minimal
-->
<style>
  html, body { margin: 0; }
  /* The street behind the HUD, so the plates are judged against a picture and not
     against a flat colour no player will ever see. Its own layer, because
     `tokens.css` keeps <body> transparent and would win over a background here. */
  #street { position: fixed; inset: 0; z-index: -1;
            background: #080e19 url('/loading-poster.jpg') center / cover no-repeat; }
  #result { position: fixed; left: 50%; top: 0; transform: translateX(-50%); margin: 0; padding: 8px 12px; z-index: 9999;
            font: 11px/1.4 Consolas, monospace; color: #f2f6f8;
            background: rgba(8, 14, 25, 0.82); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="street"></div>
<div id="app"></div>
<pre id="result">running…</pre>
<script>
/* A FAKE BRIDGE, INSTALLED BEFORE THE APP -- the same shape as the other harnesses'. */
window.__opx = { handlers: {}, emitted: [] };
window.Open77 = {
  on: function (channel, handler) {
    (window.__opx.handlers[channel] = window.__opx.handlers[channel] || []).push(handler);
  },
  emit: function (channel, payload) {
    window.__opx.emitted.push({ channel: channel, payload: payload });
  }
};
window.__deliver = function (channel, payload) {
  var list = window.__opx.handlers[channel] || [];
  for (var index = 0; index < list.length; index++) list[index](payload);
};
</script>
<script type="module">
import '/src/boot/main.ts'

const style = new URLSearchParams(location.search).get('style') || 'cyberpunk'
const results = []
let failed = 0

function check(name, ok, detail) {
  if (!ok) failed += 1
  results.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '  -- ' + detail))
  document.getElementById('result').textContent =
    'style=' + style + '\n' + results.join('\n') + '\n' + (failed === 0 ? 'PASS' : failed + ' FAILED')
  window.__RESULT__ = { failed, results }
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms))
const root = document.documentElement

async function run() {
  await sleep(200)

  // ── the allowlist, before anything is drawn ──────────────────────────────
  window.__deliver('opx:theme:set', { style: 'minimal;}html{display:none' })
  check('a style the page does not know is not written', !root.hasAttribute('data-op-style'),
        String(root.getAttribute('data-op-style')))

  window.__deliver('opx:theme:set', { style })
  check('the style lands on the root as the same word', root.getAttribute('data-op-style') === style,
        String(root.getAttribute('data-op-style')))

  // ── the surfaces ─────────────────────────────────────────────────────────
  // A catalogue first: until one arrives `t()` draws nothing, which is the page waiting
  // for its strings and not the style. With one, an unknown key is drawn as itself, so
  // the labels below can be plain words.
  window.__deliver('opx:locale:set', { strings: {
    'notify.kind.info': 'INFO', 'notify.kind.success': 'DONE',
    'notify.kind.warning': 'WARNING', 'notify.kind.error': 'FAILED',
    'progress.cancel': 'Cancel'
  } })
  window.__deliver('opx:hud:config', {
    anchor: 'bottom-left', infoAnchor: 'top-right', statusAnchor: 'bottom-left',
    statusOffset: 120, vehicleAnchor: 'bottom-center', width: 210,
    segments: 10, voiceSegments: 8
  })
  window.__deliver('opx:hud:vitals', { gauges: [
    { id: 'health', icon: 'health', label: 'Health', pct: 84, tone: 'health' },
    { id: 'armor', icon: 'armor', label: 'Armor', pct: 51 },
    { id: 'stamina', icon: 'stamina', label: 'Stamina', pct: 100 },
    { id: 'hunger', icon: 'hunger', label: 'Hunger', pct: 22 },
    { id: 'thirst', icon: 'thirst', label: 'Thirst', pct: 63 }
  ] })
  window.__deliver('opx:hud:status', { chips: [
    { id: 'phone', icon: 'P', label: 'Phone', tone: 'neutral', progress: 1 },
    { id: 'wanted', icon: 'W', label: 'Wanted', tone: 'bad',
      remainingMs: 20000, totalMs: 30000 }
  ] })
  window.__deliver('opx:hud:info', { lines: [
    { id: 'name', label: 'Name', value: 'V' },
    { id: 'eddies', label: 'Eddies', value: '12,480 $' }
  ] })
  window.__deliver('opx:hud:vehicle', {
    active: true, speed: 68, unit: 'KMH', gear: 'D', rpm: 42, integrity: 91,
    integrityLabel: 'Integrity', tone: 'neutral'
  })
  window.__deliver('opx:hud:voice', {
    active: true, state: 'talking', caption: 'Talking',
    mode: 'Normal', distance: '15 M', level: 62,
    count: 3, index: 2, key: 'Z', activation: 'B', heard: 2
  })
  window.__deliver('opx:notify:show', {
    id: 'h1', kind: 'success', title: 'Delivery', message: 'Package dropped at Kabuki market.',
    durationMs: 600000
  })
  window.__deliver('opx:notify:show', {
    id: 'h2', kind: 'error', title: 'Transfer refused', message: 'Not enough eddies on hand.',
    durationMs: 600000
  })
  window.__deliver('opx:prompts:frame', { groups: [
    { key: 'door', title: 'Door', rows: [
      { key: 'open', caps: ['E'], label: 'Open' },
      { key: 'lock', caps: ['Shift', 'E'], combo: true, label: 'Lock' }
    ] }
  ] })
  window.__deliver('opx:progress:show', {
    label: 'Refuelling', durationMs: 600000, cancelable: true, cancelKey: 'X'
  })
  window.__deliver('opx:menu:open', {
    handle: 1, anchor: 'top-left', focus: 'none', hint: 'Garage',
    first: 1, total: 5,
    rows: [
      { label: 'Quadra Turbo-R V-Tech', value: 'Stored', arrow: true, on: true },
      { label: 'Archer Hella', value: 'Out', arrow: true },
      { label: 'Yaiba Kusanagi CT-3X', value: 'Impounded', off: true },
      { rule: true, label: '' },
      { label: 'Auto-park', check: true, ticked: true }
    ]
  })

  await sleep(500)
  check('the HUD drew', document.querySelector('[data-augmented-ui]') !== null)
}

run().catch((error) => check('the harness ran to the end', false, String(error && error.stack || error)))
</script>
</body>
</html>
