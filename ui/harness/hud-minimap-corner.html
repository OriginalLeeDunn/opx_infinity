<!doctype html>
<html lang="en" class="op-theme-city">
<head>
<meta charset="utf-8">
<title>OPEN//77 hud minimap corner harness</title>
<!--
  THE BOTTOM-RIGHT CORNER BELONGS TO THE MINIMAP, measured on the real page.

  The game's own minimap now sits in the bottom-right corner, round (opx_sandy_view's
  `opx_minimap.archive`: the HUD entry anchored BottomRight, 64 x 72 units off the
  corner of the HUD's 3840x2160 grid, a 450-unit circle, the district name 54 units
  above it). This page mounts the same `ui/src/boot/main.ts` the game mounts, sends the
  payloads Lua sends -- the shipped config, a full vitals column, a player mid-sentence,
  the chip strip, the vehicle chip, the info block AND an open key strip -- and READS THE
  BOXES BACK, then checks them against the minimap's footprint computed for this
  viewport the way ink scales its HUD (the 3840x2160 grid fitted inside the screen).

  What it proves: the voice indicator is a row of the vitals column and no longer a
  block in the corner; nothing this surface draws lands on the map; the key strip opens
  above it. What it cannot prove: the native minimap itself, which only the game draws.
  The translucent disc this page paints is the footprint, not the map.

  Run it with the dev server:  npm run dev  ->  /harness/hud-minimap-corner.html
-->
<style>
  html, body { margin: 0; background: #0b1220; color: #f2f6f8;
               font: 13px/1.5 "Cascadia Mono", Consolas, monospace; }
  #result { position: fixed; left: 0; top: 0; margin: 0; padding: 14px; max-width: 46vw;
            white-space: pre-wrap; z-index: 9999; background: rgba(8, 14, 25, 0.82); }
  /* The minimap's footprint, for the eye: drawn under the HUD, measured from the same
     numbers the checks use. */
  #minimap { position: fixed; z-index: 0; pointer-events: none; }
  #minimap .disc { position: absolute; border-radius: 50%;
                   background: radial-gradient(circle, rgba(70, 90, 110, 0.55), rgba(20, 28, 40, 0.75));
                   box-shadow: inset 0 0 0 3px rgba(255, 59, 71, 0.9); }
  #minimap .label { position: absolute; text-align: center; color: rgba(232, 100, 109, 0.9);
                    font: 600 12px/1 "Rajdhani", sans-serif; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="minimap"><div class="label">JAPANTOWN</div><div class="disc"></div></div>
<div id="app"></div>
<pre id="result">running…</pre>
<script>
window.__opx = { handlers: {}, emitted: [] };
window.Open77 = {
  on: function (channel, handler) {
    (window.__opx.handlers[channel] = window.__opx.handlers[channel] || []).push(handler);
  },
  emit: function (channel, payload) {
    window.__opx.emitted.push({ channel: channel, payload: payload });
  }
};
window.__deliver = function (channel, payload) {
  var list = window.__opx.handlers[channel] || [];
  for (var index = 0; index < list.length; index++) list[index](payload);
};
</script>
<script type="module">
import '/src/boot/main.ts'

const results = []
let failed = 0

function check(name, ok, detail) {
  if (!ok) failed += 1
  results.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || detail === undefined ? '' : '  -- ' + detail))
  draw()
}

function draw() {
  document.getElementById('result').textContent =
    results.join('\n') + '\n\n' + (failed === 0 ? 'PASS' : failed + ' FAILED')
  // Keeps `done` and `boxes` once run() has set them: a late draw must not erase them.
  window.__RESULT__ = Object.assign(window.__RESULT__ || {}, { failed, results })
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms))

function box(selector) {
  const element = document.querySelector(selector)
  if (!element) return null
  const rect = element.getBoundingClientRect()
  return rect.width === 0 && rect.height === 0 ? null : rect
}

function overlaps(one, other) {
  if (!one || !other) return false
  return one.left < other.right && other.left < one.right &&
         one.top < other.bottom && other.top < one.bottom
}

function describe(rect) {
  if (!rect) return 'not drawn'
  return `l=${rect.left.toFixed(1)} t=${rect.top.toFixed(1)} r=${rect.right.toFixed(1)} b=${rect.bottom.toFixed(1)}`
}

/**
 * The minimap's footprint in this page's pixels. Ink lays the HUD out on a 3840x2160
 * grid fitted inside the screen; the page is the screen. So one HUD unit is
 * min(width / 3840, height / 2160) pixels here, whatever the aspect.
 */
function footprint(width, height) {
  const unit = Math.min(width / 3840, height / 2160)
  const RIGHT = 64, BOTTOM = 72, SIZE = 450, LABEL = 40, LABEL_GAP = 14
  const right = width - RIGHT * unit
  const bottom = height - BOTTOM * unit
  const left = right - SIZE * unit
  const top = bottom - SIZE * unit
  return {
    unit,
    circle: { left, top, right, bottom, width: right - left, height: bottom - top },
    label: { left: left + 5 * unit, right: right - 5 * unit, top: top - (LABEL_GAP + LABEL) * unit, bottom: top - LABEL_GAP * unit },
    whole: { left, right, top: top - (LABEL_GAP + LABEL) * unit, bottom }
  }
}

function paintFootprint(f) {
  const host = document.getElementById('minimap')
  const disc = host.querySelector('.disc')
  const label = host.querySelector('.label')
  Object.assign(host.style, { left: '0px', top: '0px', width: '100%', height: '100%' })
  Object.assign(disc.style, { left: f.circle.left + 'px', top: f.circle.top + 'px',
                              width: f.circle.width + 'px', height: f.circle.height + 'px' })
  Object.assign(label.style, { left: f.label.left + 'px', top: f.label.top + 'px',
                               width: (f.label.right - f.label.left) + 'px',
                               height: (f.label.bottom - f.label.top) + 'px',
                               fontSize: (30 * f.unit) + 'px', lineHeight: (f.label.bottom - f.label.top) + 'px' })
}

async function run() {
  await sleep(200)

  // The shipped layout, exactly as config/hud.lua and config/prompts.lua declare it.
  window.__deliver('opx:hud:config', {
    anchor: 'bottom-left', infoAnchor: 'top-left', statusAnchor: 'bottom-left',
    statusOffset: 120, vehicleAnchor: 'bottom-center', width: 210,
    segments: 10, voiceSegments: 8
  })
  window.__deliver('opx:prompts:config', { anchor: 'bottom-right', offset: 270, maxWidth: 420 })

  window.__deliver('opx:hud:vitals', { gauges: [
    { id: 'health', icon: 'health', label: 'hud.gauge.health', pct: 84, points: 210, tone: 'health' },
    { id: 'armor', icon: 'armor', label: 'hud.gauge.armor', pct: 51 },
    { id: 'stamina', icon: 'stamina', label: 'hud.gauge.stamina', pct: 100 },
    { id: 'hunger', icon: 'hunger', label: 'hud.gauge.hunger', pct: 72 },
    { id: 'thirst', icon: 'thirst', label: 'hud.gauge.thirst', pct: 63 }
  ] })
  window.__deliver('opx:hud:status', { chips: [
    { id: 'phone', icon: 'P', label: 'hud.status.phone', tone: 'neutral', progress: 1 },
    { id: 'wanted', icon: 'W', label: 'hud.status.wanted', tone: 'bad', remainingMs: 20000, totalMs: 30000 }
  ] })
  window.__deliver('opx:hud:info', { lines: [
    { id: 'name', label: 'hud.info.name', value: 'MATT GOOD' },
    { id: 'eddies', label: 'hud.info.eddies', value: '12,480 $' }
  ] })
  window.__deliver('opx:hud:vehicle', {
    active: true, speed: 68, unit: 'KMH', gear: 'D', rpm: 42, integrity: 91,
    integrityLabel: 'hud.vehicle.integrity', tone: 'neutral'
  })
  // A player mid-sentence, with two others audible: the fullest the voice row gets.
  window.__deliver('opx:hud:voice', {
    active: true, state: 'talking', caption: 'hud.voice.state.talking',
    mode: 'hud.voice.mode.normal', distance: '15 M', level: 62,
    count: 3, index: 2, key: 'Z', activation: 'B', heard: 2
  })
  // An open key strip: a door and a vehicle at once.
  window.__deliver('opx:prompts:frame', { groups: [
    { key: 'door', title: 'Door', rows: [
      { key: 'open', caps: ['E'], label: 'Open' },
      { key: 'knock', caps: ['F'], label: 'Knock' } ] },
    { key: 'car', title: 'Quadra Turbo-R', rows: [
      { key: 'enter', caps: ['F'], label: 'Enter' },
      { key: 'trunk', caps: ['SHIFT', 'F'], combo: true, label: 'Trunk' } ] }
  ] })

  await sleep(500)
  for (const element of document.querySelectorAll('.voice, .vitals, .gauge')) element.style.transition = 'none'
  await sleep(50)

  const width = window.innerWidth
  const height = window.innerHeight
  const f = footprint(width, height)
  paintFootprint(f)

  // ── the voice indicator is a row of the vitals column ───────────────────
  const vitals = box('.vitals')
  const voice = box('.vitals .voice')
  check('the voice indicator is drawn inside the vitals column', voice !== null && vitals !== null,
        `${describe(voice)} / ${describe(vitals)}`)
  const live = document.querySelector('.vitals .voice')
  check('and it reached its live state', live !== null && live.classList.contains('live') && live.classList.contains('talking'),
        live ? live.className : 'not drawn')
  check('it is one row tall, like a gauge', voice !== null && voice.height <= 20, voice ? voice.height.toFixed(1) : '')
  const gauges = [...document.querySelectorAll('.vitals .gauge')].map((element) => element.getBoundingClientRect())
  const lastGauge = gauges[gauges.length - 1]
  check('it sits under the last gauge', voice !== null && lastGauge !== undefined && voice.top >= lastGauge.bottom - 0.5,
        `${describe(voice)} under ${describe(lastGauge)}`)
  check('and within the column\'s width', voice !== null && vitals !== null &&
        voice.left >= vitals.left - 12 && voice.right <= vitals.right + 12,
        `${describe(voice)} in ${describe(vitals)}`)
  check('its meter lights from the left, by a clip',
        (document.querySelector('.vitals .voice .fill')?.getAttribute('style') || '').indexOf('inset(0px 38') !== -1 ||
        (document.querySelector('.vitals .voice .fill')?.style.clipPath || '').startsWith('inset(0px 38'),
        document.querySelector('.vitals .voice .fill')?.style.clipPath)
  check('the reach reads in the readout column', (document.querySelector('.vitals .voice .reach')?.textContent || '').trim().length > 0)
  check('the rx counter shows the two others', (document.querySelector('.vitals .voice .rx')?.textContent || '').indexOf('2') !== -1)
  check('no voice block is pinned to a corner any more',
        [...document.querySelectorAll('.voice')].every((element) => element.closest('.vitals') !== null),
        `${document.querySelectorAll('.voice').length} voice element(s)`)

  // ── nothing lands on the map ─────────────────────────────────────────────
  const neighbours = {
    'the vitals column': '.vitals', 'the chip strip': '.hud .strip', 'the vehicle chip': '.vehicle',
    'the info block': '.info', 'the key strip': '.prompts .strip'
  }
  for (const [what, selector] of Object.entries(neighbours)) {
    const other = box(selector)
    check(`${what} is drawn`, other !== null, selector)
    check(`${what} does not overlap the minimap or its district name`, !overlaps(f.whole, other),
          `${describe(other)} vs minimap ${describe(f.whole)}`)
  }

  // ── the key strip opens above the map ───────────────────────────────────
  const strip = box('.prompts .strip')
  check('the key strip sits above the district name', strip !== null && strip.bottom <= f.label.top + 0.5,
        `strip bottom ${strip ? strip.bottom.toFixed(1) : '-'} vs label top ${f.label.top.toFixed(1)}`)
  check('and stays on the right edge, over the map rather than across the screen',
        strip !== null && strip.right > width * 0.6, describe(strip))

  check('the minimap is wholly inside the screen',
        f.whole.left >= 0 && f.whole.top >= 0 && f.whole.right <= width && f.whole.bottom <= height,
        `${describe(f.whole)} in ${width}x${height}`)

  window.__boxes = {
    viewport: `${width}x${height}`, unit: f.unit, minimap: describe(f.whole), circle: describe(f.circle),
    vitals: describe(vitals), voice: describe(voice), chips: describe(box('.hud .strip')),
    vehicle: describe(box('.vehicle')), info: describe(box('.info')), prompts: describe(strip)
  }
  window.__RESULT__ = { failed, results, done: true, boxes: window.__boxes }
  draw()
}

run().catch((error) => {
  check('the harness ran to the end', false, String(error && error.stack ? error.stack : error))
  window.__RESULT__ = { failed: failed + 1, results, done: true }
  draw()
})
</script>
</body>
</html>
