<style>
  /* ═══ THE FACES ══════════════════════════════════════════════════════════════
     The three the design system declares -- Rajdhani (display), Saira (body),
     IBM Plex Mono (labels and data). `design-system/fonts.css` supplies them from
     @fontsource and the Vite build inlines them as data URIs; this page is outside
     that build, so a '@fontsource/...' URL here would never resolve and every name
     would silently fall back to Segoe UI. The same files from the same packages are
     copied into `fonts/` next to this page. 59 KB, no network.

     ONLY AT WEIGHTS THAT EXIST, and these four cover all four type roles below:
     `.op-label` wants display 700, `.op-copy` body 400, `.op-eyebrow` mono 600 and
     `.op-value` mono 500. CSS font matching resolves 600 up to the 700 face and 500
     down to the 400 face, so each role lands on a real face and nothing is
     synthesised -- which matters on mono, where a faux bold loses the tabular
     alignment the percentage depends on. */
  @font-face{
    font-family:'Rajdhani'; font-style:normal; font-weight:700; font-display:block;
    src:url('./fonts/rajdhani-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:block;
    src:url('./fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'IBM Plex Mono'; font-style:normal; font-weight:700; font-display:block;
    src:url('./fonts/ibm-plex-mono-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Saira'; font-style:normal; font-weight:400; font-display:block;
    src:url('./fonts/saira-latin-400-normal.woff2') format('woff2');
  }

  /* ═══ TOKENS -- A HAND COPY. KEEP IT IN STEP. ════════════════════════════════
     Every value below is copied verbatim out of `ui/src/design-system/tokens.css`,
     which is the one place a value is decided for the other twelve surfaces. It is
     copied because this page cannot import: there is no bundler for it and no Vue,
     and it is mounted before any of ours is running.

     A COPY IS A LIABILITY AND THIS ONE IS DELIBERATE. If a value moves in
     tokens.css it does NOT move here, and the loading screen quietly stops being the
     same product as the game it is loading. Anyone editing tokens.css should edit
     this block too.

     IT IS ONLY WHAT THIS PAGE USES -- not the whole file. The cut sizes it never
     draws, the space steps it never spends, the alarm glow, the stutter and the
     entrance are all absent on purpose: an unused copy is a copy nobody notices has
     gone stale.

     THE THEME DOES NOT REACH HERE EITHER, and it cannot. `modules/theme` validates
     `config/theme.lua` and `design-system/theme.ts` writes the result onto `:root`
     at run time -- and that is our Lua and our bundle, neither of which is running
     during a join. An operator with a blue server gets a red loading screen and
     then a blue game. That is a known seam, not an oversight. */
  :root{
    /* the red ladder -- tokens.css, "THE RED LADDER" */
    --op-red-rgb:      255, 59, 71;
    --op-red-idle-rgb: 232, 67, 79;
    --op-red-deep-rgb: 200, 32, 46;
    --op-red-hi-rgb:   255, 107, 120;
    --op-red-text-rgb: 232, 100, 109;

    --op-red-idle: rgba(var(--op-red-idle-rgb), 0.62);
    --op-red-deep: rgb(var(--op-red-deep-rgb));
    --op-red:      rgb(var(--op-red-rgb));
    --op-red-hi:   rgb(var(--op-red-hi-rgb));
    --op-red-text: rgb(var(--op-red-text-rgb));

    /* the alarm -- tokens.css. Red is the voice, so red cannot be the alarm; the
       escalation leaves the hue. The one phase that reaches it is `failed`. */
    --op-alarm-rgb: 255, 168, 174;
    --op-alarm: rgb(var(--op-alarm-rgb));

    /* the neutral ramp -- tokens.css, "THE NEUTRAL RAMP" */
    --op-text:       #f2f6f8;
    --op-text-dim:   #8d99a8;
    --op-text-faint: rgba(141, 153, 168, 0.72);

    /* the ground -- tokens.css, "THE GROUND" */
    --op-plate-rgb:     28, 8, 9;
    --op-plate-lit-rgb: 74, 21, 25;
    --op-plate-a:       0.78;
    --op-plate-quiet-a: 0.58;
    --op-plate:       rgba(var(--op-plate-rgb), var(--op-plate-a));
    --op-plate-quiet: rgba(var(--op-plate-rgb), var(--op-plate-quiet-a));

    --op-interlace-a: 0.05;
    --op-interlace: rgba(var(--op-red-rgb), var(--op-interlace-a));

    --op-ink:
      0 1px 2px rgba(0, 0, 0, 0.95),
      0 0 9px rgba(0, 0, 0, 0.8);

    /* type -- tokens.css, "TYPE". The stacks are the runtime's, in the runtime's
       order, so a face that fails to decode falls back to the same Windows voices
       the twelve surfaces fall back to. */
    --op-font-display: 'Rajdhani', 'Bahnschrift Condensed', 'Arial Narrow', sans-serif;
    --op-font-body:    'Saira', 'Bahnschrift', 'Segoe UI', system-ui, sans-serif;
    --op-font-mono:    'IBM Plex Mono', 'Cascadia Mono', 'Consolas', ui-monospace, monospace;

    --op-fs-micro: 9px;
    --op-fs-label: 10px;
    --op-fs-meta:  11px;
    --op-fs-body:  14px;
    --op-fs-lead:  16px;
    --op-fs-head:  26px;
    --op-fs-hero:  40px;

    --op-track-micro: 0.18em;
    --op-track-label: 0.12em;
    --op-track-lead:  0.04em;
    --op-track-head:  0.02em;

    /* space -- tokens.css, "SPACE" */
    --op-space-1: 4px;
    --op-space-2: 8px;
    --op-space-3: 12px;
    --op-space-4: 16px;
    --op-space-5: 24px;

    --op-inset-x: 32px;
    --op-inset-y: 28px;
    --op-bleed: 10px;

    /* shape -- tokens.css, "SHAPE" */
    --op-cut-sm: 6px;
    --op-cut-lg: 20px;

    /* the plane -- tokens.css, "THE PLANE" */
    --op-persp: 900px;
    --op-tilt: 7deg;

    /* motion -- tokens.css, "MOTION" */
    --op-ease: cubic-bezier(0.2, 0, 0, 1);
    --op-dur-fast: 90ms;
    --op-dur: 150ms;

    /* NOT FROM tokens.css, AND THERE IS NO TOKEN TO COPY. Every in-game surface is
       transparent because the game renders behind it; this one is the only thing on
       the screen and needs an opaque floor under a film that has not decoded yet. */
    --op-void: #05070a;
  }

  /* ═══ CARRIED FROM design-system/shapes.css ══════════════════════════════════
     The presets this page draws with, and nothing else. Same caveat as the tokens:
     these are copies, and shapes.css is the original. */

  /* The house stroke at rest, on every augmented element. */
  [data-augmented-ui]{
    --aug-border-all: 1px;
    --aug-border-bg: var(--op-red-idle);
  }

  /* A control: a closed box with the top-right corner chamfered. On this surface a
     frame means "you can press this" -- which is why the player bar's two buttons
     carry one and the readouts above them do not. */
  .op-frame{
    --aug-tr: var(--op-cut-sm);
    background: var(--op-plate);
    color: var(--op-red-text);
  }
  .op-frame:hover:not(.is-off){
    --aug-border-bg: var(--op-red-deep);
    --aug-border-all: 1.5px;
    color: var(--op-red);
  }

  /* The enclosure. Two opposite corners, never adjacent: a box cut top-right and
     bottom-left reads as a plate slid into place. */
  .op-bay{
    --aug-tr: var(--op-cut-lg);
    --aug-bl: var(--op-cut-lg);
  }

  /* The lit leading edge, as a gradient across the border layer -- the top-left run
     takes the lit tone and the hand-off sits on the diagonal the chamfer implies. */
  .op-arete{
    --aug-border-bg: linear-gradient(135deg,
      var(--op-red-hi) 0%,
      var(--op-red-hi) 42%,
      var(--op-red-idle) 58%,
      var(--op-red-idle) 100%);
  }

  /* `.op-lift` IS NOT CARRIED. It is a `drop-shadow`, so it gives its element a
     backing store, and shapes.css forbids that on anything whose value changes every
     frame. The bay holds the progress bar, and the bar moves on every frame of a
     sweep -- so the bloom would be paid for sixty times a second for a shape that is
     on screen for the length of a join. */

  /* ═══ CARRIED FROM design-system/surface.css ═════════════════════════════════ */

  /* The tilt. The perspective goes on the WRAPPER, never on the thing that tilts:
     on the plane itself every descendant would get its own vanishing point. */
  .op-plane{
    perspective: var(--op-persp);
    contain: layout paint style;
    padding: var(--op-bleed);
  }
  .op-plane > *{
    transform-origin: var(--op-origin, left center);
    transform: rotateY(var(--op-tilt-signed, 0deg));
  }
  /* Anchored to the left edge, so it hinges on the left edge: the sign and the
     origin both come from which edge the surface is pinned to. */
  .op-anchor-left{
    --op-tilt-signed: var(--op-tilt);
    --op-origin: left center;
  }

  /* One ink shadow per surface, declared on the root and inherited. An override
     replaces the whole list. */
  .op-ink{ text-shadow: var(--op-ink); }

  /* The scanline, and it goes ONLY on something enclosed -- a striped rectangle with
     nothing around it is the floating rectangle the interlace exists to prevent. It
     is on ::before, which is free because every preset above asks augmented-ui for
     the border layer and not the inlay. */
  .op-interlace{ position: relative; }
  .op-interlace::before{
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      var(--op-interlace) 0 1px,
      transparent 1px 3px
    );
  }

  /* The four type roles. Every line on this page is written out of them. */
  .op-label{
    font: 700 var(--op-fs-lead)/1.25 var(--op-font-display);
    letter-spacing: var(--op-track-lead);
    text-transform: uppercase;
  }
  .op-value{
    font: 500 var(--op-fs-meta)/1 var(--op-font-mono);
    letter-spacing: var(--op-track-label);
    font-variant-numeric: tabular-nums;
  }
  .op-eyebrow{
    font: 600 var(--op-fs-micro)/1 var(--op-font-mono);
    letter-spacing: var(--op-track-micro);
    text-transform: uppercase;
  }
  .op-copy{
    font: 400 var(--op-fs-meta)/1.4 var(--op-font-body);
  }

  /* ═══ THE LOADING SCREEN ═════════════════════════════════════════════════════
     The client mounts this page from our verified pack files, in a sandboxed
     surface, OVER the built-in OPEN//77 cover -- so this is what a player sees for
     the whole of the join instead of the stock screen. `open77.lua` declares it with
     `loadscreen "web/loading.html"` and `web_files { "web/**" }` ships it.

     THE FILM IS THE BACKGROUND AND THE SURFACE IS ONE BAY OVER IT. Everything the
     page has to say lives inside a single enclosure hinged on the left edge of the
     screen -- the same plate-slid-into-place the menu strip is -- and nothing in it
     is absolutely positioned relative to anything else, so no two lines can land on
     each other. A two-stop scrim darkens exactly the corner the bay occupies and
     leaves the rest of the frame alone, so the film stays a film instead of being
     washed grey to make white text work.

     SELF-CONTAINED ON PURPOSE. The surface's origin is confined to this resource and
     there is no network beyond it: the shapes, the tokens, the typefaces, the video
     and its poster are all files in this folder, and the ground behind everything is
     a colour that is already correct before either of them decodes.

     THE CLIP IS A WEBM, AND THAT IS NOT A PREFERENCE. VP9 video + Opus audio, because
     the browser this page runs inside cannot decode H.264 OR AAC AT ALL. CEF is built
     with Chromium's free codec set, and an MP4 handed to it demuxes and then dies with
         media\filters\ffmpeg_demuxer.cc  PipelineStatus::DEMUXER_ERROR_NO_SUPPORTED_STREAMS
     which is the demuxer reporting that the container is fine and NO stream in it is
     playable. "video/mp4" in this runtime means nothing, `canPlayType` is no guide,
     and the file's own name is no guide either -- the codecs have to be VP8/VP9/AV1
     plus Opus/Vorbis. A 15.1 MiB H.264 file sat here and simply never played, while
     the poster and the ground covered for it so convincingly that it looked like a
     styling choice rather than a decode failure.

     IT MUST ALSO STAY UNDER 16 MiB -- scripting/src/ResourceHost.cpp:40 enforces
     kMaximumWebFileBytes = 16 MiB while scanning `web/**` and refuses with
     `invalid_web_file:<name>`, which fails THE WHOLE RESOURCE, not just this file: the
     loadscreen silently stops arriving and opx_infinity does not start. Both limits
     are checked by byte count, never by trust. If the file is missing or the codec
     will not decode, the poster and the ground stand in; the progress bar is
     unaffected either way, because it is not the video's job.

     SOUND. The host starts Chromium with `autoplay-policy=user-gesture-required`
     (webhost/src/WebHostApp.cpp:66), so unmuted playback is refused until the page
     receives a real user gesture. The page therefore tries to play WITH sound first
     and, only if that is refused, retries muted and says so. The first click
     (anywhere) then unmutes, within the policy, with no platform change. The gesture
     only arrives if the surface was given cursor focus when it was mounted: the shell
     mounts this page with `page:setFocus(false, true)`, and on a build that still
     passes `false` for the cursor the controls below cannot be clicked and the video
     stays silent -- the page is correct either way and never shows a control it
     cannot honour as if it had worked.

     IT RUNS BEFORE ANY LUA OF OURS DOES. The resource's scripts are not running during
     the join, so this page cannot ask for anything -- it is told, by the client, over
     two events:
       progress { phase, label, fraction, detail, server }
       server   { name }
     `fraction` is 0..1, or negative for "no idea yet" (the bar sweeps). `label` is
     what to print over `phase`, and Lua is not involved in either.

     THE SERVER'S NAME IS NOT DRAWN, AND THAT IS THE EDIT. It had a line of its own in
     the bay, under `ENTERING THE CITY` -- and it prints in the display face at the
     head step, which made it a SECOND `OPEN//77` in the same enclosure as the brand
     mark, one above the other, saying the same word twice. On a server that kept the
     default name that is all it ever said; on a renamed one it is a line the player
     has already read in the launcher. `p.server` and the `server` event are still
     consumed and dropped, so a client that sends them is sending nothing wrong. */

  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ width: 100%; height: 100%; overflow: hidden; }
  /* tokens.css makes body transparent because the game renders behind every other
     surface. Nothing renders behind this one. */
  body{
    background: var(--op-void);
    color: var(--op-red-text);
    font: 400 var(--op-fs-body)/1.4 var(--op-font-body);
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
  }

  /* --- the film, full-bleed and behind everything --------------------------- */
  .stage{ position: absolute; inset: 0; overflow: hidden; background: #000; }
  #video{
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(1.02) contrast(1.02);
  }
  body.no-video #video{ display: none; }
  /* The ground when there is no film: the lit plate taken down into the void, which
     is the same red-until-it-is-black the bay sits on. */
  body.no-video .stage{
    background:
      radial-gradient(120% 90% at 20% 80%,
        rgba(var(--op-plate-lit-rgb), 0.95) 0%,
        rgba(var(--op-plate-rgb), 1) 70%),
      var(--op-void);
  }
  /* NO CLIP CONFIGURED IS NOT THE SAME AS A CLIP THAT FAILED, and they should not
     look alike. The gradient above is the designed stand-in for a film that was
     meant to be there and is not -- it keeps the screen looking deliberate while
     something is wrong. An operator who cleared `LOADSCREEN.video` asked for no
     film at all, so they get the void flat, with no glow suggesting a picture is
     still loading. */
  body.no-clip .stage{ background: var(--op-void); }
  /* Two stops, because one would have to grey the whole picture to make the bay
     legible. On the plate channels rather than an invented near-black, so the
     darkened corner is the same ground the bay is. */
  .scrim{
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top,
        rgba(var(--op-plate-rgb), 0.94) 0%,
        rgba(var(--op-plate-rgb), 0.74) 16%,
        rgba(var(--op-plate-rgb), 0.30) 40%,
        rgba(var(--op-plate-rgb), 0) 66%),
      linear-gradient(to right,
        rgba(var(--op-plate-rgb), 0.82) 0%,
        rgba(var(--op-plate-rgb), 0.34) 28%,
        rgba(var(--op-plate-rgb), 0) 54%);
  }
  /* NO OUTLINE AROUND THE SHOT. The contributor's page drew a 1px rectangle inset
     from every screen edge with two accent brackets on it. A frame on this surface
     means "press this", and a border around the whole film is the one thing on the
     screen that can never be pressed. The bay is the only enclosure here. */

  /* --- the bay: everything the page says, in one enclosure ------------------- */
  .dock{
    position: absolute;
    z-index: 2;
    /* Every offset pays the bleed back: `.op-plane` pads by `--op-bleed` so the
       plane has room inside its own paint containment, and padding moves the dock. */
    left: calc(var(--op-inset-x) - var(--op-bleed));
    bottom: calc(var(--op-inset-y) - var(--op-bleed));
    width: min(520px, 48vw);
  }
  /* THE GROUND IS ON THE BAY HERE, AND IN THE MENU IT IS NOT. The menu's bay is
     mostly the space BETWEEN rows, so a plate there fills what carries nothing and
     turns the strip into a window; its rows each carry their own. This bay is a
     solid block of type over a moving picture with nothing else in it, so the bay IS
     the ground under type -- which is the one thing the contract leaves filled. The
     quiet weight, not the base: a scrim is already darkening this corner, and two
     grounds at full strength put a black rectangle on the film. */
  .bay{ position: relative; background: var(--op-plate-quiet); }
  /* The interlace sits on this element's ::before at z-index 2 and the content below
     it takes no z-index of its own, so the stripes pass OVER the type. That is what
     they do on every other enclosed surface; at 0.05 they are a texture on the
     plate, not a veil over the words. */
  .bay-inner{
    position: relative;
    display: grid;
    gap: var(--op-space-4);
    padding: var(--op-space-5);
  }

  /* --- the brand ------------------------------------------------------------- */
  .brand{ display: grid; gap: var(--op-space-1); }
  /* A FLEX ROW, NOT A TEXT RUN, and that is geometry rather than appearance. The
     face's own content area is 1.28em tall while this is set at line-height .9, so
     as an inline box the accent `//` stands taller than its line and hangs into the
     row below -- a real box collision even though the ink never touches. As flex
     items the runs are blockified and each takes a line-height-driven box instead.
     Identical pixels; only the boxes stop overflowing. */
  .mark{
    display: flex; align-items: baseline;
    font: 700 clamp(var(--op-fs-head), 3.4vw, var(--op-fs-hero))/0.9 var(--op-font-display);
    letter-spacing: var(--op-track-head);
    text-transform: uppercase;
    color: var(--op-text);
  }
  .mark b{ color: var(--op-red); }
  .mode{ color: var(--op-red-text); }

  /* --- what is loading ------------------------------------------------------- */
  .status{ display: grid; gap: var(--op-space-2); }
  .kicker{ color: var(--op-text-dim); }

  /* --- the progress bar ------------------------------------------------------
     A gauge, drawn the way `HudVitals` draws one: the TRACK is the enclosure and
     carries the frame, and the bar inside it is the one filled shape the contract
     leaves standing, because a quantity has to have an area or it is not a
     quantity. */
  .progress{ display: grid; gap: var(--op-space-2); }
  .bar-line{ display: flex; justify-content: space-between; align-items: baseline; gap: var(--op-space-2); }
  .bar-phase{ color: var(--op-red-text); }
  .bar-pct{ color: var(--op-red-hi); font-size: var(--op-fs-label); }
  .track{
    position: relative;
    height: 14px;
    --aug-tr: var(--op-cut-sm);
    /* 3px of inset on every side is the bar's clearance from the frame, and it is
       measured rather than chosen: the chamfer cuts `--op-cut-sm` off the top-right
       corner, so a bar held 3px from the top and 3px from the right ends exactly on
       the diagonal. HudVitals' gauge track is the same three pixels for the same
       reason. */
    padding: 3px;
  }
  /* THE BAR TAKES THE TRACK'S CORNER. Without this the one filled shape on the page
     is the one shape still square, poking through a cut frame at 100%. The cut is
     derived, not written: this box sits 3px inside the border box and the diagonal
     runs at 45 degrees, so what it meets there is the frame's cut less that inset.
     It is on THIS box and not on `.fill` precisely so the transform never touches
     a clip path. */
  .bar{
    display: block; width: 100%; height: 100%; overflow: hidden;
    clip-path: polygon(
      0 0,
      calc(100% - (var(--op-cut-sm) - 3px)) 0,
      100% calc(var(--op-cut-sm) - 3px),
      100% 100%,
      0 100%);
  }
  /* `transform-origin: left` and `scaleX` -- never `width` -- so a fraction arriving
     is a composited transform and not a relayout. */
  .fill{
    display: block; width: 100%; height: 100%;
    background: var(--op-red);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform var(--op-dur) var(--op-ease);
  }
  /* No fraction from the client: a sweep, because a bar sitting at zero is a stall.
     The keyframes carry the scale as well as the offset, so they replace the inline
     transform outright instead of fighting it -- and the translate is written first
     in the list, which leaves its percentages measured against the full track rather
     than against the 34% the scale leaves.

     THE SCALE IS ALSO A DECLARATION AND NOT ONLY A KEYFRAME, which is what a reduced
     motion player sees: the block below neuters the iteration count, so the animation
     runs once for a millisecond and then stops applying -- and without this the bar
     would fall back to `scaleX(0)` and read as the stall the sweep exists to deny. A
     static third of a bar is the honest picture of "no idea yet". */
  .track.busy .fill{
    transition: none;
    transform: scaleX(0.34);
    animation: op-sweep 1.1s var(--op-ease) infinite;
  }
  @keyframes op-sweep{
    from{ transform: translateX(-110%) scaleX(0.34); }
    to{ transform: translateX(360%) scaleX(0.34); }
  }
  .detail{
    min-height: calc(var(--op-fs-meta) * 1.4);
    color: var(--op-text-faint);
    overflow-wrap: anywhere;
  }

  /* THE ALARM RUNG, AND IT IS THE ONLY THING HERE THAT LEAVES THE HUE. A red bar
     going redder inside a red frame says nothing, so the one phase the client sends
     that is not progress -- `failed` -- climbs out of the family into white-hot.
     Scoped to the bay's own parts and never to the whole page: the film keeps
     playing and the brand stays the brand. */
  body.is-failed .track{ --aug-border-bg: var(--op-alarm); --aug-border-all: 2.6px; }
  body.is-failed .fill{ background: var(--op-alarm); }
  body.is-failed .bar-phase,
  body.is-failed .bar-pct{ color: var(--op-alarm); }

  /* --- the player bar, last in the same stack -------------------------------- */
  .player{ display: flex; align-items: center; gap: var(--op-space-3); }
  /* These two ARE controls, so these two get a frame. `.op-frame` brings the cut,
     the ground and the hover; what is left here is the size and the icon. */
  /* Sized for a mouse, not a glance: real volume controls a player can hit while
     the city streams in. */
  .btn{
    width: 40px; height: 40px; flex: 0 0 auto; cursor: pointer;
    display: grid; place-items: center;
    border: 0;
    transition: color var(--op-dur-fast) linear;
  }
  .btn:focus-visible{ outline: 1px solid var(--op-red-hi); outline-offset: 2px; }
  .btn svg{ width: 16px; height: 16px; fill: currentcolor; }
  .btn .i-pause, .btn .i-mute{ display: none; }
  .btn.playing .i-play{ display: none; }
  .btn.playing .i-pause{ display: block; }
  .btn.muted .i-vol{ display: none; }
  .btn.muted .i-mute{ display: block; }

  /* A slider is a control whose frame would be its own track, so it draws the track
     and not a box: an outline around a 3px rule is a box with a line in it. */
  /* The track is filled up to the level (`--vol`, written by `paint`), so the
     slider reads as a volume at a glance and not only where its thumb is. */
  .vol{ flex: 0 0 clamp(160px, 14vw, 240px); display: flex; align-items: center; gap: var(--op-space-2); }
  input[type=range]{
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; cursor: pointer; outline: none;
    background: linear-gradient(to right,
      var(--op-red) 0 var(--vol, 100%),
      rgba(var(--op-red-idle-rgb), 0.28) var(--vol, 100%) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; background: var(--op-red-hi);
  }
  input[type=range]::-moz-range-thumb{
    width: 14px; height: 14px; border: 0; background: var(--op-red-hi);
  }
  input[type=range]:focus-visible{ outline: 1px solid var(--op-red-hi); outline-offset: 4px; }
  .vol-val{ color: var(--op-text-dim); min-width: 36px; }
  .vol-val::after{ content: "%"; }
  /* Shown only while the host is refusing unmuted playback and no gesture has landed
     yet -- so a silent screen says why instead of looking broken. */
  .sound-hint{ display: none; color: var(--op-red-hi); }
  body.needs-gesture .sound-hint{ display: block; }

  /* Narrow surfaces: the bay takes the width it needs and nothing else moves,
     because it is the only thing over the picture. */
  @media (max-width: 720px){
    .dock{ width: min(420px, 86vw); }
    .bay-inner{ gap: var(--op-space-3); padding: var(--op-space-4); }
  }

  /* Animation enhances, it never gates -- tokens.css. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
      transition-delay: 0ms !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <!-- VP9 + Opus. An MP4 source would never play here: see the note above. -->
    <video id="video" playsinline preload="auto" loop poster="./loading-poster.jpg">
      <source src="./loading.webm" type="video/webm">
    </video>
    <div class="scrim"></div>
  </div>

  <div class="dock op-plane op-anchor-left op-ink">
    <div class="bay op-bay op-arete" data-augmented-ui="tr-clip bl-clip border">
      <div class="bay-inner op-interlace">
        <div class="brand">
          <div class="mark" id="mark">OPEN<b>//</b>77</div>
          <div class="mode op-eyebrow" id="mode">Infinity</div>
        </div>

        <div class="status">
          <div class="kicker op-eyebrow">Entering the city</div>
        </div>

        <div class="progress">
          <div class="bar-line">
            <span class="bar-phase op-eyebrow" id="phase">Connecting</span>
            <span class="bar-pct op-value" id="pct"></span>
          </div>
          <div class="track busy" id="bar" data-augmented-ui="tr-clip border"
               role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
            <span class="bar"><span class="fill" id="fill"></span></span>
          </div>
          <p class="detail op-copy" id="detail"></p>
        </div>

        <div class="player">
          <button class="btn op-frame" id="play" type="button" aria-label="Play or pause"
                  data-augmented-ui="tr-clip border">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path class="i-play" d="M3 1.5v13l11-6.5z"/>
              <g class="i-pause"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></g>
            </svg>
          </button>
          <button class="btn op-frame" id="mute" type="button" aria-label="Mute or unmute"
                  data-augmented-ui="tr-clip border">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <g class="i-vol">
                <path d="M2 6h3l4-3.5v11L5 10H2z"/>
                <path d="M11.4 5.2a4 4 0 0 1 0 5.6l-.9-.9a2.8 2.8 0 0 0 0-3.8z"/>
                <path d="M13.3 3.3a6.8 6.8 0 0 1 0 9.4l-.9-.9a5.6 5.6 0 0 0 0-7.6z"/>
              </g>
              <g class="i-mute">
                <path d="M2 6h3l4-3.5v11L5 10H2z"/>
                <path d="M11 6.1l1.1-1.1 3 3-1.1 1.1z"/>
                <path d="M14 6.1l1.1 1.1-3 3-1.1-1.1z" transform="translate(-3.1)"/>
              </g>
            </svg>
          </button>
          <div class="vol">
            <input id="vol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
            <span class="vol-val op-value" id="volVal">100</span>
          </div>
          <span class="sound-hint op-eyebrow">Click for sound</span>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ── WHAT AN OPERATOR CHANGES ──────────────────────────────────────────────
     The whole of this screen's configuration, in one place, because there is
     nowhere else it could live. This page runs BEFORE any Lua of ours does and
     has no network beyond its own folder (see the header): it cannot read
     `config/*.lua`, it cannot be told anything by the runtime, and it cannot
     fetch a settings file. A named block at the top of its own script is the
     only form a setting can take here, so it is written as one rather than
     scattered through the markup below.

     THE TWO RULES THAT ARE NOT PREFERENCES, and both fail in ways that do not
     look like what they are:

       CODEC. VP9 or AV1 video with Opus or Vorbis audio. CEF carries Chromium's
       free codec set only, so an H.264/AAC file -- which is what almost
       everything downloaded from the web is -- demuxes and then dies with
       DEMUXER_ERROR_NO_SUPPORTED_STREAMS. The poster and the ground stand in so
       convincingly that it reads as a styling choice, not a broken file. To
       convert one you already have the rights to:

         ffmpeg -i yours.mp4 -c:v libvpx-vp9 -crf 34 -b:v 0 \
                -vf scale=1280:-2 -c:a libopus -b:a 96k out.webm

       SIZE. Under 16 MiB, counted in bytes, enforced while the host scans
       `web/**`. Over it the resource is refused with `invalid_web_file:<name>`
       and OPX_INFINITY DOES NOT START AT ALL -- it is not the loading screen
       that breaks, it is everything. The shipped clip is 14.83 MiB, so there is
       about 1.1 MiB of headroom: check the byte count before deploying, not the
       look of it.

     Drop your file in `ui/public/`, name it here, run `npm run build`, deploy.
     ────────────────────────────────────────────────────────────────────────── */
  var LOADSCREEN = {
    // The clip. Either a file beside this one -- VP9/AV1 + Opus/Vorbis, under
    // 16 MiB, the two rules above -- or an `https://` URL you host.
    //
    // A URL IS ALLOWED AND IT IS NOT FREE. `Open77.webui.create` says external
    // media is permitted with CORS and TLS enforced, so the codec rule still
    // applies but the 16 MiB cap does not. What it costs is a network
    // dependency at the single worst moment to have one: the join, on the
    // player's connection, with nothing else on screen. A host that is slow,
    // blocked or down leaves the poster standing in. A remote source that fails
    // therefore falls back once to the bundled file -- keep one there.
    //
    // NOT SOMEBODY ELSE'S VIDEO. This takes a URL you are entitled to serve.
    // A third-party player embedded as a silent background, stripped of its
    // controls, is not what that player is offered for, and the clip in it is
    // not yours to re-serve either.
    //
    // EMPTY MEANS NO FILM, and a black ground rather than the stand-in the
    // screen draws when a clip it expected did not arrive. Nothing is fetched,
    // the poster included. Clearing this is also what makes the shipped
    // `loading.webm` dead weight: 14.83 MiB of the pack every player downloads,
    // safe to delete from `ui/public/` once nothing names it -- but keep one
    // there while a URL is configured, because a remote clip that fails falls
    // back to it.
    video: "./loading.webm",

    // Shown before the first frame decodes, and instead of the clip when the
    // file is missing or will not play. Any format the browser draws.
    poster: "./loading-poster.jpg",

    // "cover" fills the frame and crops what does not fit, which is what makes
    // a clip read as a background. "contain" shows the whole frame and leaves
    // bars: correct for something with text baked into it.
    fit: "cover",

    // Whether to try playing with sound. The host starts Chromium with
    // `autoplay-policy=user-gesture-required`, so this is an ATTEMPT: refused,
    // the page retries muted and says so, and the first click unmutes. Set
    // false for a screen that should always start silent.
    sound: true,

    // The name in the bay: the brand mark, and the line under it, for a server
    // that wants its own name on the screen. Plain text, drawn in the display
    // face at the head step, so keep the mark short; the page title follows the
    // mark. Empty keeps the page's own OPEN//77 and Infinity.
    name: "",
    subtitle: "",
  };

  var $=function(id){return document.getElementById(id)};

  /* The name, from the block above. Text only -- never markup -- and only when it
     differs from what the page already says. */
  (function(){
    var markEl=$("mark"), modeEl=$("mode");
    if(markEl && typeof LOADSCREEN.name==="string" && LOADSCREEN.name
       && markEl.textContent!==LOADSCREEN.name) markEl.textContent=LOADSCREEN.name;
    if(modeEl && typeof LOADSCREEN.subtitle==="string" && LOADSCREEN.subtitle
       && modeEl.textContent!==LOADSCREEN.subtitle) modeEl.textContent=LOADSCREEN.subtitle;
    if(typeof LOADSCREEN.name==="string" && LOADSCREEN.name)
      document.title=LOADSCREEN.name+" \u2014 Loading";
  })();
  var phaseEl=$("phase"),pctEl=$("pct"),barEl=$("bar"),fillEl=$("fill"),
      detailEl=$("detail"),videoEl=$("video"),
      playEl=$("play"),muteEl=$("mute"),volEl=$("vol"),volValEl=$("volVal");

  /* The block above, applied to the element. The markup below still names the
     shipped clip and poster, so a build where this script never runs shows the
     same screen it always did rather than a blank frame -- these overwrite it
     only when they differ, and `load()` is what makes a changed source actually
     be fetched rather than sitting in the DOM unread. */
  if(videoEl){
    var sourceEl = videoEl.querySelector("source");

    /* NO CLIP AT ALL, and it is a setting rather than a failure. An empty
       `video` means the operator does not want a film, so nothing is fetched --
       not the source the markup names, and not the poster either, which would
       otherwise sit there as a still picture of the film they just removed. The
       body says so in its own class, and the ground goes flat black. */
    if(!LOADSCREEN.video){
      if(sourceEl) sourceEl.removeAttribute("src");
      videoEl.removeAttribute("poster");
      videoEl.load();
      document.body.classList.add("no-video", "no-clip");
    }else{
      if(LOADSCREEN.poster && videoEl.getAttribute("poster") !== LOADSCREEN.poster){
        videoEl.setAttribute("poster", LOADSCREEN.poster);
      }
      if(LOADSCREEN.fit) videoEl.style.objectFit = LOADSCREEN.fit;
      if(sourceEl && sourceEl.getAttribute("src") !== LOADSCREEN.video){
        sourceEl.setAttribute("src", LOADSCREEN.video);
        videoEl.load();
      }
    }
  }

  /* ── the player ────────────────────────────────────────────────────────────── */
  // Why the play/pause state is read from the element rather than kept in a flag: a
  // refused autoplay, a decode error and the reduced-motion pause all leave the
  // element paused without anyone asking, and the button has to agree with what the
  // screen is actually doing.
  var pref = {volume:1, muted:false};
  try{
    var raw = localStorage.getItem("op77.loadscreen.media");
    if(raw){
      var saved = JSON.parse(raw);
      if(typeof saved.volume==="number" && saved.volume>=0 && saved.volume<=1) pref.volume=saved.volume;
      if(typeof saved.muted==="boolean") pref.muted=saved.muted;
    }
  }catch(e){}
  /* The operator's switch beats the player's remembered choice, and only in the
     silent direction: `sound: false` is a decision about the screen, so a
     `muted:false` left in localStorage from a previous build must not undo it.
     The mute control still works -- a player may turn it back on -- because
     this sets the starting state, not a lock. */
  if(LOADSCREEN.sound === false) pref.muted = true;
  function persist(){
    try{ localStorage.setItem("op77.loadscreen.media", JSON.stringify(pref)); }catch(e){}
  }

  function paint(){
    var playing = videoEl && !videoEl.paused;
    playEl.classList.toggle("playing", !!playing);
    var silent = !videoEl || videoEl.muted || videoEl.volume===0;
    muteEl.classList.toggle("muted", !!silent);
    if(videoEl){
      var shown = Math.round((videoEl.muted?0:videoEl.volume)*100);
      volValEl.textContent = shown;
      if(volEl.value !== String(shown)) volEl.value = String(shown);
      volEl.style.setProperty("--vol", shown + "%");
    }
  }

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* A REMOTE CLIP FALLS BACK TO THE SHIPPED ONE, EXACTLY ONCE.

     `LOADSCREEN.video` may be an https URL, because the host allows a surface
     external media with CORS and TLS enforced. That buys freedom from the 16 MiB
     per-file cap and costs a network dependency at the single worst moment to
     have one: the join, on somebody else's connection, with nothing else on
     screen. A host that is slow, blocked or simply down would otherwise leave
     the poster and the ground standing in, which reads as a styling choice
     rather than as a fetch that failed.

     So a remote source that errors is retried once against the bundled file and
     only then gives up. Once, because a loop between two failing sources during
     a join would be worse than either failure. A bundled source that fails is
     not retried at all -- it is already the fallback. */
  var BUNDLED_VIDEO = "./loading.webm";
  var triedBundled = false;

  function noVideo(){
    var source = videoEl && videoEl.querySelector("source");
    var current = source && source.getAttribute("src");
    if(!triedBundled && source && current && current !== BUNDLED_VIDEO
       && /^https?:/i.test(current)){
      triedBundled = true;
      source.setAttribute("src", BUNDLED_VIDEO);
      videoEl.load();
      start();
      return;
    }
    document.body.classList.add("no-video");
  }

  // One gesture is all the policy wants. Any click, tap or key the host manages to
  // deliver satisfies it -- listening on the document means the player controls and
  // the background both work, and a gesture used for anything else still counts.
  function satisfiedGesture(){
    document.body.classList.remove("needs-gesture");
    if(videoEl && !videoEl.muted) return;
    if(!videoEl || pref.muted) return;
    videoEl.muted = false;
    videoEl.volume = pref.volume;
    if(videoEl.paused) start();
    paint();
  }
  ["pointerdown","mousedown","click","keydown","touchstart"].forEach(function(name){
    document.addEventListener(name, satisfiedGesture, true);
  });

  // Unmuted first, muted only if the host refuses. Setting `muted` on an element that
  // was never allowed to start would leave a frozen frame, so the retry happens after
  // the rejection rather than before it.
  function start(){
    if(!videoEl) return;
    videoEl.volume = pref.volume;
    videoEl.muted = pref.muted;
    var attempt = videoEl.play();
    if(attempt && attempt.catch){
      attempt.catch(function(){
        if(pref.muted) return;
        videoEl.muted = true;
        var retry = videoEl.play();
        if(retry && retry.catch) retry.catch(function(){});
        document.body.classList.add("needs-gesture");
        paint();
      });
    }
  }

  if(videoEl){
    videoEl.addEventListener("canplay", function(){ document.body.classList.remove("no-video"); });
    videoEl.addEventListener("playing", paint);
    videoEl.addEventListener("pause", paint);
    videoEl.addEventListener("volumechange", paint);
    videoEl.addEventListener("error", noVideo);
    if(videoEl.networkState===3) noVideo();
    if(reduced){
      // The poster is the whole picture for someone who asked for less motion. The
      // player bar stays live, so pressing play is theirs to choose -- and that press
      // is itself the gesture that permits sound.
      videoEl.pause();
    }else{
      start();
    }
    paint();
  }

  playEl.addEventListener("click", function(){
    if(!videoEl) return;
    if(videoEl.paused) start(); else videoEl.pause();
    paint();
  });
  muteEl.addEventListener("click", function(){
    if(!videoEl) return;
    var goingSilent = !videoEl.muted && videoEl.volume>0;
    if(goingSilent){
      pref.muted = true;
      videoEl.muted = true;
    }else{
      pref.muted = false;
      videoEl.muted = false;
      if(pref.volume===0) pref.volume = 0.6;
      videoEl.volume = pref.volume;
      if(videoEl.paused) start();
    }
    persist();
    paint();
  });
  volEl.addEventListener("input", function(){
    if(!videoEl) return;
    var value = Number(volEl.value)/100;
    videoEl.volume = value;
    pref.volume = value;
    // Dragging the slider to zero is a mute, and dragging it up is an unmute: the
    // element already reflects that, so the preference follows the slider rather than
    // fighting it.
    if(value===0){ videoEl.muted = true; pref.muted = true; }
    else { videoEl.muted = false; pref.muted = false; if(videoEl.paused) start(); }
    persist();
    paint();
  });
  volEl.addEventListener("change", persist);

  /* ── the client's two events ───────────────────────────────────────────────── */
  // The client's own phase names, rendered only when the payload carries no `label`.
  // A phase this table does not know is printed with its underscores opened out,
  // because an unknown word on screen beats a blank line.
  var PHASES={connecting:"Connecting",handshake:"Authenticating",authenticating:"Authenticating",
    manifest:"Reading manifest",downloading:"Downloading",verifying:"Verifying",
    ready:"Preparing",world:"Loading",active:"Loading",failed:"Failed"};

  function onProgress(p){
    if(!p) return;
    var label=p.label||PHASES[p.phase]||String(p.phase||"").replace(/_/g," ")||"Loading";
    phaseEl.textContent=label;
    // The alarm is keyed off the PHASE and never off the label: the label is free
    // text the client may have written, and a server that titles a phase "Failed"
    // for its own reasons must not be able to set off the one rung that leaves the
    // hue. See the contract, "RED IS THE VOICE, SO RED CANNOT BE THE ALARM".
    document.body.classList.toggle("is-failed", p.phase==="failed");
    var f=Number(p.fraction);
    if(!isFinite(f)||f<0){
      // The sweep is a keyframed transform, so the inline one is cleared rather than
      // overridden -- two transforms on one element, one of them invisible, is the
      // kind of thing that survives until somebody changes the keyframes.
      barEl.classList.add("busy");
      fillEl.style.transform="";
      pctEl.textContent="";
      barEl.removeAttribute("aria-valuenow");
    }else{
      barEl.classList.remove("busy");
      var pct=Math.max(0,Math.min(100,Math.round(f*100)));
      fillEl.style.transform="scaleX("+(pct/100)+")";
      pctEl.textContent=pct+"%";
      barEl.setAttribute("aria-valuenow",String(pct));
    }
    if(typeof p.detail==="string") detailEl.textContent=p.detail;
  }

  if(window.Open77){
    try{ Open77.on("progress",onProgress); }catch(e){}
    // The handshake. Until this goes out the client is holding its own events, and a
    // page that never reports simply never hears anything.
    try{ Open77.ready(); }catch(e){}
  }
})();
</script>
</body>
</html>
